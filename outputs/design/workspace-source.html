<style>
#md-design {color-scheme:light dark;font:14px/1.5 system-ui,sans-serif;color:light-dark(#252c31,#e1e7eb);--md-bg:light-dark(#fbfcfc,#171c20);--md-panel:light-dark(#f1f4f3,#20272a);--md-line:light-dark(#dce2df,#354044);--md-muted:light-dark(#64736e,#a0b2aa);--md-accent:light-dark(#176955,#72cdb0)}
#md-design *{box-sizing:border-box}#md-design .md-app{background:var(--md-bg);border:1px solid var(--md-line);border-radius:14px;overflow:hidden;min-height:690px}#md-design button,#md-design select{font:inherit;color:inherit;background:var(--md-bg);border:1px solid var(--md-line);border-radius:7px;padding:7px 11px}#md-design button{cursor:pointer}#md-design .md-head{display:flex;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--md-line);padding-right:100px;flex-wrap:wrap}#md-design .md-brand{font-weight:500;letter-spacing:.04em}#md-design .md-muted{color:var(--md-muted);font-size:12px}#md-design .md-pill{background:var(--md-panel);border-radius:20px;padding:4px 10px;font-size:12px}#md-design .md-request{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--md-line)}#md-design .md-request p{margin:2px 0}#md-design .md-grid{display:grid;grid-template-columns:225px minmax(0,1fr) 210px}#md-design .md-workflow{padding:20px 14px;border-right:1px solid var(--md-line)}#md-design h3{font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;margin:0 0 16px;color:var(--md-muted)}#md-design .md-step{display:flex;text-align:left;gap:10px;width:100%;margin-bottom:8px;padding:10px;border-color:transparent;background:transparent}#md-design .md-step.active{background:var(--md-panel);border-color:var(--md-line)}#md-design .md-step span:first-child{color:var(--md-accent)}#md-design .md-step small{display:block;font-size:12px;color:var(--md-muted)}#md-design .md-view{padding:18px;min-width:0}#md-design .md-viewbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}#md-design .md-scene{position:relative;height:290px;background:var(--md-panel);border-radius:10px;margin:12px 0;overflow:hidden}#md-design svg{width:100%;height:100%}#md-design .md-scene-label{position:absolute;bottom:12px;left:14px;font-size:12px;color:var(--md-muted)}#md-design .md-scrub{display:flex;align-items:center;gap:12px;font-size:12px}#md-design input{min-width:0;flex:1;accent-color:var(--md-accent)}#md-design .md-current{margin-top:16px;padding:12px 0;border-top:1px solid var(--md-line)}#md-design .md-current p{margin:4px 0}#md-design .md-settings{padding:20px 16px;border-left:1px solid var(--md-line)}#md-design dl{margin:0}#md-design dt{font-size:12px;color:var(--md-muted);margin-top:14px}#md-design dd{margin:2px 0}#md-design .md-logs{padding:14px 24px;border-top:1px solid var(--md-line)}#md-design .md-loghead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}#md-design .md-loghead button[aria-pressed=true]{background:var(--md-panel)}#md-design .md-lines{font-size:12px;padding-top:12px;min-height:88px;overflow-wrap:anywhere}#md-design .md-line{display:flex;gap:16px;padding:3px 0}#md-design .md-line time{color:var(--md-muted);flex-shrink:0}#md-design .md-primary{background:var(--md-accent);color:light-dark(#fff,#102d24);border-color:transparent}#md-design .md-studio .md-grid{grid-template-columns:minmax(0,1fr) 280px}#md-design .md-studio .md-workflow{grid-column:2;grid-row:1;border-right:0;border-left:1px solid var(--md-line)}#md-design .md-studio .md-view{grid-column:1;grid-row:1}#md-design .md-studio .md-settings{grid-column:1/-1;border-left:0;border-top:1px solid var(--md-line);padding:12px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}#md-design .md-studio .md-settings h3{margin:0}#md-design .md-studio dl{display:flex;gap:24px;flex-wrap:wrap}#md-design .md-studio dt{margin:0}#md-design .md-studio .md-scene{height:260px}#md-design .md-studio .md-current{margin-top:10px}#md-design .md-studio .md-settings .md-more{display:none}@media(max-width:760px){#md-design .md-grid,#md-design .md-studio .md-grid{grid-template-columns:1fr}#md-design .md-workflow,#md-design .md-studio .md-workflow{grid-column:1;grid-row:auto;border:0;border-bottom:1px solid var(--md-line);display:flex;flex-wrap:wrap;gap:4px}#md-design .md-workflow h3{width:100%;margin-bottom:4px}#md-design .md-step{width:auto;flex:1 1 140px;margin:0}#md-design .md-view,#md-design .md-studio .md-view{grid-column:1;grid-row:auto}#md-design .md-settings{border-left:0;border-top:1px solid var(--md-line)}#md-design .md-settings dl{display:flex;gap:20px;flex-wrap:wrap}#md-design .md-scene{height:240px}#md-design .md-request{align-items:flex-start;flex-wrap:wrap}#md-design .md-app{min-height:1150px}#md-design .md-head{padding-left:18px}}
</style>
<div id="md-design"><div class="viz-carousel" aria-label="Simulation workspace layouts"><section data-variant="Workflow first"><div class="md-app" id="md-workflow"></div></section><section data-variant="Viewer first" hidden><div class="md-app md-studio" id="md-studio"></div></section></div></div>
<script>
(()=>{const root=document.getElementById('md-design');const steps=['Inspect structure','Prepare protein','Minimize energy','Run dynamics','Summarize results'];const notes=['Inspecting atom identities and missing components.','Reviewing hydrogens, termini, and preparation changes.','Reducing unfavorable contacts before dynamics.','Integrating dynamics at 300 K.','Collecting trajectory, final structure, and checks.'];
for(const app of root.querySelectorAll('.md-app')){let selected=3,detailed=false,paused=false;app.innerHTML=`<header class="md-head"><span class="md-brand">molecular / workspace</span><span class="md-muted">Ubiquitin · run 001</span><span class="md-pill">Interactive design preview</span></header><div class="md-request"><div><p>Run ubiquitin for <strong>10 ps</strong> in implicit solvent at <strong>300 K</strong></p><p class="md-muted">ubiquitin.pdb · OpenMM · illustrative run state</p></div><button class="md-pause">Pause run</button></div><div class="md-grid"><aside class="md-workflow"><h3>Workflow</h3>${steps.map((s,i)=>`<button class="md-step ${i===3?'active':''}" data-step="${i}"><span>${i<3?'✓':i===3?'◉':'○'}</span><span>${s}<small>${i<3?'Complete':i===3?'Running · 4 / 10 ps':'Upcoming'}</small></span></button>`).join('')}</aside><main class="md-view"><div class="md-viewbar"><span class="md-viewtitle">Dynamics · saved frame</span><label class="md-muted">View <select aria-label="Protein representation"><option>Ribbon</option><option>Backbone</option></select></label></div><div class="md-scene"><svg viewBox="0 0 440 290" role="img" aria-label="Illustrative protein shape, not ubiquitin structural data"><g class="md-protein" fill="none" stroke="var(--md-accent)" stroke-linecap="round" stroke-linejoin="round"><path d="M104 200 C50 120 158 55 188 88 S101 170 159 201 S286 177 266 116 S187 65 223 150 S343 234 348 151 S286 65 258 89 S341 142 308 182 S216 231 192 200" stroke-width="12" opacity=".28"/><path d="M104 200 C50 120 158 55 188 88 S101 170 159 201 S286 177 266 116 S187 65 223 150 S343 234 348 151 S286 65 258 89 S341 142 308 182 S216 231 192 200" stroke-width="4"/><path d="M117 104 L226 184 M128 89 L239 170 M145 79 L250 155 M163 79 L255 137" stroke-width="8" opacity=".6"/></g></svg><span class="md-scene-label">Schematic preview · structural data not loaded</span></div><div class="md-scrub"><span>Saved frames</span><input type="range" min="0" max="4" step="1" value="4" aria-label="Saved frame time"><span class="md-frame">4.0 ps</span></div><div class="md-current" aria-live="polite"><p class="md-action">Running dynamics <span class="md-muted">· 4 / 10 ps</span></p><p class="md-muted md-next">Next: summarize results and quality checks</p></div></main><aside class="md-settings"><h3>Run settings</h3><dl><div><dt>Temperature</dt><dd>300 K</dd></div><div><dt>Solvent</dt><dd>Implicit</dd></div><div><dt>Dynamics</dt><dd>10 ps</dd></div><div><dt>Preparation</dt><dd>Minimization</dd></div></dl><details class="md-more" style="margin-top:24px"><summary>Full configuration</summary><p class="md-muted">Force field, solvent model, timestep, seeds, and platform appear here after configuration.</p></details></aside></div><section class="md-logs"><div class="md-loghead"><span>Activity <span class="md-muted">· run 001</span></span><div><button class="md-short" aria-pressed="true">Short log</button> <button class="md-detail" aria-pressed="false">Detailed log</button></div></div><div class="md-lines" aria-live="polite"></div></section>`;
const q=s=>app.querySelector(s);function log(){q('.md-lines').innerHTML=detailed?'<div class="md-muted">Illustrative execution record · no simulation has been run</div><div class="md-line"><time>00:00</time><span>[inspect] Input: ubiquitin.pdb · structure checks complete</span></div><div class="md-line"><time>00:03</time><span>[minimize] Stage complete · configuration and outputs linked here</span></div><div class="md-line"><time>00:05</time><span>[dynamics] target_time=10 ps · temperature=300 K · solvent=implicit</span></div><div class="md-line"><time>00:09</time><span>[dynamics] saved_frame_time=4 ps · state='+ (paused?'paused':'running')+'</span></div>':'<div class="md-line"><time>00:03</time><span>Minimization complete. Prepared structure saved.</span></div><div class="md-line"><time>00:05</time><span>Started 10 ps of dynamics at 300 K.</span></div><div class="md-line"><time>00:09</time><span>'+ (paused?'Run paused at 4 ps.':'4 / 10 ps complete. Latest saved frame available.')+'</span></div>';q('.md-short').setAttribute('aria-pressed',!detailed);q('.md-detail').setAttribute('aria-pressed',detailed)}
q('.md-short').onclick=()=>{detailed=false;log()};q('.md-detail').onclick=()=>{detailed=true;log()};q('.md-pause').onclick=()=>{paused=!paused;q('.md-pause').textContent=paused?'Resume run':'Pause run';if(selected===3)q('.md-action').textContent=(paused?'Dynamics paused':'Running dynamics')+' · 4 / 10 ps';log()};app.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{selected=+b.dataset.step;app.querySelectorAll('[data-step]').forEach(x=>x.classList.toggle('active',x===b));q('.md-viewtitle').textContent=selected===3?'Dynamics · saved frame':steps[selected]+' · '+(selected===4?'pending':'saved structure');q('.md-action').textContent=notes[selected];q('.md-next').textContent=selected===3?'Next: summarize results and quality checks':selected===4?'Results will appear when the run finishes.':'Viewing completed stage · dynamics is '+(paused?'paused':'running');q('.md-scrub').hidden=selected!==3;q('.md-scene').style.opacity=selected===4?'.4':'1'});q('input').oninput=e=>{q('.md-frame').textContent=Number(e.target.value).toFixed(1)+' ps';q('.md-viewtitle').textContent=+e.target.value===4?'Dynamics · latest saved frame':'Dynamics · earlier saved frame';q('.md-protein').style.transform='rotate('+((+e.target.value-4)*3)+'deg)';q('.md-protein').style.transformOrigin='center'};q('select').onchange=e=>{app.querySelectorAll('.md-protein path').forEach((p,i)=>p.style.strokeWidth=e.target.value==='Backbone'?(i===0?'0':'2'):'');};log();if(globalThis.Tweak){const state={showSettings:true};new Tweak({container:app,onChange:()=>q('.md-settings').hidden=!state.showSettings}).addToggle(state,'showSettings',{label:'Show run settings'});}}
})();
</script>
<style>
#md-design [hidden]{display:none!important}#md-design .md-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}#md-design .md-tabs button[aria-selected=true]{background:var(--md-panel);border-color:var(--md-accent)}#md-design .md-plot{height:304px;margin:12px 0;position:relative}#md-design .md-plot svg{display:block}#md-design .md-plot text{font:12px system-ui;fill:currentColor}#md-design .md-plottools{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px}#md-design .md-chart-note{font-size:12px;color:var(--md-muted);min-height:36px}#md-design .md-chart-readout{font-size:12px;color:var(--md-muted);min-height:22px}#md-design .md-studio .md-scene{height:304px}
</style>
<script>
(()=>{const root=document.getElementById('md-design'),app=document.getElementById('md-studio');document.getElementById('md-workflow').parentElement.remove();app.parentElement.hidden=false;const carousel=root.querySelector('.viz-carousel');carousel.classList.remove('viz-carousel');app.parentElement.removeAttribute('data-variant');const view=app.querySelector('.md-view');let tab='structure',energy='Potential',axis='step';const saved=window.openai?.widgetState?.modelContent;if(saved?.viewerTab&&['structure','temperature','energy'].includes(saved.viewerTab))tab=saved.viewerTab;
const nav=document.createElement('div');nav.className='md-tabs';nav.setAttribute('role','tablist');nav.setAttribute('aria-label','Viewer content');nav.innerHTML=['structure','temperature','energy'].map(t=>`<button id="md-tab-${t}" role="tab" aria-controls="md-panel-${t}" aria-selected="${t===tab}" data-view="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('');view.prepend(nav);const structure=document.createElement('div');structure.id='md-panel-structure';structure.setAttribute('role','tabpanel');structure.setAttribute('aria-labelledby','md-tab-structure');for(const cls of ['.md-viewbar','.md-scene','.md-scrub'])structure.append(app.querySelector(cls));nav.after(structure);
for(const t of ['temperature','energy']){const panel=document.createElement('div');panel.id='md-panel-'+t;panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','md-tab-'+t);panel.innerHTML=`<div class="md-plottools"><span>${t==='temperature'?'Temperature · target 300 K':'Energy · '+energy} <span class="md-muted">/ dynamics</span></span><label>${t==='energy'?'<select class="md-energy-kind" aria-label="Energy quantity"><option>Potential</option><option>Kinetic</option><option>Total</option></select> ':''}<select class="md-axis" aria-label="Horizontal axis"><option value="step">Timesteps</option><option value="time">Time (ps)</option></select></label></div><div class="md-plot"></div><div class="md-chart-readout" aria-live="polite">Select a point to inspect it</div><div class="md-chart-note">Illustrative data · 0–4 ps of the requested 10 ps. ${t==='temperature'?'Dashed line: 300 K target.':'Thermostatted dynamics: total energy need not be conserved.'}</div>`;structure.after(panel);panel.querySelector('.md-axis').onchange=e=>{axis=e.target.value;app.querySelectorAll('.md-axis').forEach(x=>x.value=axis);draw()};if(t==='energy')panel.querySelector('.md-energy-kind').onchange=e=>{energy=e.target.value;panel.querySelector('.md-plottools > span').firstChild.textContent='Energy · '+energy+' ';draw()};}
function persist(){window.openai?.setWidgetState?.({modelContent:{layout:'Viewer first',viewerTab:tab},privateContent:{}})?.catch(()=>{})}
function render(){for(const t of ['structure','temperature','energy']){app.querySelector('#md-panel-'+t).hidden=tab!==t;app.querySelector('#md-tab-'+t).setAttribute('aria-selected',tab===t)}draw()}
nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.view;render();persist()});nav.onkeydown=e=>{if(!['ArrowLeft','ArrowRight'].includes(e.key))return;e.preventDefault();const all=['structure','temperature','energy'];tab=all[(all.indexOf(tab)+(e.key==='ArrowRight'?1:2))%3];render();app.querySelector('#md-tab-'+tab).focus();persist()};
function draw(){if(tab==='structure')return;const panel=app.querySelector('#md-panel-'+tab),host=panel.querySelector('.md-plot'),w=host.clientWidth;if(!w)return;const h=304,L=72,R=18,T=20,B=52,values=Array.from({length:41},(_,i)=>{const kinetic=2900+100*Math.sin(i*1.7)+45*Math.cos(i*.83),potential=-12800+800*Math.exp(-i/7)+80*Math.sin(i*1.3);return {x:i*50,y:tab==='temperature'?300+9*Math.sin(i*1.7)+4*Math.cos(i*.83):energy==='Kinetic'?kinetic:energy==='Total'?potential+kinetic:potential}});let lo=Math.min(...values.map(d=>d.y),...(tab==='temperature'?[300]:[])),hi=Math.max(...values.map(d=>d.y),...(tab==='temperature'?[300]:[]));const pad=(hi-lo)*.15;lo-=pad;hi+=pad;const x=v=>L+v/2000*(w-L-R),y=v=>h-B-(v-lo)/(hi-lo)*(h-T-B);const ticks=Array.from({length:4},(_,i)=>lo+(hi-lo)*i/3);const path=values.map((d,i)=>(i?'L':'M')+x(d.x).toFixed(2)+','+y(d.y).toFixed(2)).join(' ');host.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Illustrative ${tab} versus ${axis==='step'?'timesteps':'time'}; no simulation results"><rect x="${L}" y="${T}" width="${w-L-R}" height="${h-T-B}" fill="none" stroke="var(--md-line)"/>${ticks.map(v=>`<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--md-line)"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v)}</text>`).join('')}${[0,1000,2000].map(v=>`<text x="${x(v)}" y="${h-B+21}" text-anchor="${v===0?'start':v===2000?'end':'middle'}">${axis==='step'?v:v*.002}</text>`).join('')}<text x="${(L+w-R)/2}" y="${h-7}" text-anchor="middle">${axis==='step'?'Timestep':'Time (ps)'}${axis==='step'?' · example Δt = 2 fs':''}</text><text transform="translate(17 ${(T+h-B)/2}) rotate(-90)" text-anchor="middle">${tab==='temperature'?'Temperature (K)':'Energy (kJ/mol)'}</text>${tab==='temperature'?`<line x1="${L}" x2="${w-R}" y1="${y(300)}" y2="${y(300)}" stroke="currentColor" stroke-dasharray="5 4" opacity=".5"/>`:''}<path d="${path}" fill="none" stroke="var(--md-accent)" stroke-width="2"/><line class="md-guide" x1="${L}" x2="${L}" y1="${T}" y2="${h-B}" stroke="currentColor" opacity="0"/><rect class="md-hit" x="${L}" y="${T}" width="${w-L-R}" height="${h-T-B}" fill="transparent"/></svg>`;const hit=host.querySelector('.md-hit');function inspect(e){const rect=host.getBoundingClientRect(),v=Math.max(0,Math.min(2000,(e.clientX-rect.left-L)/(w-L-R)*2000)),i=Math.round(v/50),d=values[i];panel.querySelector('.md-chart-readout').textContent=`Step ${d.x} · ${(d.x*.002).toFixed(2)} ps · ${d.y.toFixed(1)} ${tab==='temperature'?'K':'kJ/mol'}`;const guide=host.querySelector('.md-guide');guide.setAttribute('x1',x(d.x));guide.setAttribute('x2',x(d.x));guide.setAttribute('opacity','.35')}hit.onpointermove=inspect;hit.onclick=inspect;}
new ResizeObserver(draw).observe(view);window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.modelContent?.viewerTab;if(['structure','temperature','energy'].includes(v)){tab=v;render()}});render();
})();
</script>
