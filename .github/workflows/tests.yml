name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-simulation.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install OpenMM
        run: python -m pip install -r requirements-simulation.txt
      - name: Run Python tests (including skip reasons)
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript and display refresh
        run: |
          node --check web/app.js
          node tests/test_display_refresh.cjs
